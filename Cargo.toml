[package]
name = "candlelighter"
version = "0.4.0"
edition = "2021"
authors = ["Dirk Bangel <dirk.bangel@gmx.de>"]
description = "A Keras like abstraction layer on top of the Rust ML framework candle"
readme = "README.md"
documentation = "https://github.com/BDUG/Lighter"
homepage = "https://github.com/BDUG/Lighter"
repository= "https://github.com/BDUG/Lighter"
license = "MPL-2.0"
keywords = ["machine","learning","ML","candle","KERAS"]
categories = ["science", "hardware-support","development-tools","computer-vision","algorithms"]
exclude = [".github/", ".*", ".vscode/","target/*","Cargo.lock"]

[lib]
name = "candlelighter"
path = "./lib/mod.rs"

[[bin]]
name = "candlelighter"
path = "src/main.rs"
required-features = ["candle"]

[features]
default = ["candle", "native"]
# The original Candle-backed training API.
candle = [
    "dep:candle-core", "dep:candle-nn", "dep:candle-ext",
    "dep:candle-transformers", "dep:hf-hub", "dep:tokenizers",
    "dep:terminal-menu", "dep:ndarray", "dep:ndarray-rand",
    "dep:savefile", "dep:savefile-derive", "dep:multiarray",
]
# A backend-neutral inference runtime. This feature deliberately has no Candle
# dependency and can be built with `--no-default-features --features native`.
native = ["dep:half", "dep:hf-hub", "dep:regex", "dep:safetensors", "dep:tokenizers", "dep:ureq"]

[dependencies]
ndarray = { version = "0.15.6", features = ["serde"], optional = true }
ndarray-rand = { version = "0.14.0", optional = true }
rand = "0.8.5"
serde = { version = "1.0.145", features = ["derive"] }
savefile = { version = "0.17.1", optional = true }
savefile-derive = { version = "0.17.1", optional = true }
candle-core = { version = "0.5.0", optional = true }
candle-nn = { version = "0.5.0", optional = true }
serde_json = "1.0.109"
anyhow = "1.0.79"
terminal-menu = { version = "3.0.0", optional = true }
candle-ext = { version = "0.1.7", optional = true }
multiarray = { version = "0.1.3", optional = true }
candle-transformers = { version = "0.5.0", optional = true }
hf-hub = { version = "0.3.2", optional = true }
tokenizers = { version = "0.19.1", optional = true }
half = { version = "2.4", optional = true }
safetensors = { version = "0.4", optional = true }
ureq = { version = "2.9", features = ["json"], optional = true }
regex = { version = "1.10", optional = true }
